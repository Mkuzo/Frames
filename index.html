<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        dd{
            background-color: red;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Html list</h2>
    <p>Lists help organize information in a clear way</p>
    <ul>
        <li>Apple</li>
        <li>Bananas</li>
        <li>Oranges</li>
        <li>Mangoes</li>
    </ul>
    <ol attribute = 1>
        <li>First Step</li>
        <li>Second Step</li>
        <li>Third Step</li>
        <li>Fourth Step</li>
    </ol>
    <ol attribute = "A">
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
    </ol>
    <dl>
        <dt>
            <dd>Hello</dd>
            <dd>Js</dd>
            <dd>Html</dd>
            <dd>Css</dd>
        </dt>
    </dl>
</body>
</html>
